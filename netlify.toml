# Configuração oficial do GBM Web no Netlify.
# Valores declarados aqui substituem os informados no formulário de deploy.
[build]
  command = "npm run build:netlify"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Rotas /api/* são atendidas pelas Functions nativas via config.path.
# Nunca coloque as chaves do Resend neste arquivo.

# Site com duas páginas: / (vendas) e /projetos (demonstrações).
[[redirects]]
  from = "/projetos"
  to = "/projetos.html"
  status = 200

[[redirects]]
  from = "/demos/barbearia.html"
  to = "/projetos?demo=barbearia"
  status = 301

[[redirects]]
  from = "/demos/restaurante.html"
  to = "/projetos?demo=restaurante"
  status = 301

[[redirects]]
  from = "/demos/petshop.html"
  to = "/projetos?demo=petshop"
  status = 301
